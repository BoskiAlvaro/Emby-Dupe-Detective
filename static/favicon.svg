<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a2e"/>

  <!-- Magnifier lens (circle) -->
  <circle cx="26" cy="26" r="14" fill="none" stroke="#e0b84e" stroke-width="4"/>

  <!-- Film strip inside lens -->
  <rect x="16" y="21" width="20" height="10" rx="1.5" fill="none" stroke="#e0b84e" stroke-width="1.5"/>
  <!-- Film perforations left -->
  <rect x="16" y="22.5" width="3" height="2.5" rx="0.5" fill="#e0b84e"/>
  <rect x="16" y="26" width="3" height="2.5" rx="0.5" fill="#e0b84e"/>
  <!-- Film perforations right -->
  <rect x="33" y="22.5" width="3" height="2.5" rx="0.5" fill="#e0b84e"/>
  <rect x="33" y="26" width="3" height="2.5" rx="0.5" fill="#e0b84e"/>
  <!-- Duplicate lines inside film -->
  <line x1="21" y1="23.5" x2="31" y2="23.5" stroke="#e0b84e" stroke-width="1.2"/>
  <line x1="21" y1="26" x2="31" y2="26" stroke="#e0b84e" stroke-width="1.2"/>
  <line x1="21" y1="28.5" x2="31" y2="28.5" stroke="#e0b84e" stroke-width="1.2"/>

  <!-- Magnifier handle -->
  <line x1="37" y1="37" x2="50" y2="50" stroke="#e0b84e" stroke-width="5" stroke-linecap="round"/>
</svg>