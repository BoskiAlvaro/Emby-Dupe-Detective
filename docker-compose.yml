version: "3.9"

services:
  emby-dupe-detective:
    build: .
    container_name: emby-dupe-detective
    ports:
      - "5000:5000"
    volumes:
      # Persist config.json between container restarts
      - emby_dupes_data:/app/data
    environment:
      - PORT=5000
      - DEBUG=false
      # Optional: override secret key for session security
      # - SECRET_KEY=your-random-secret-here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  emby_dupes_data:
    driver: local
